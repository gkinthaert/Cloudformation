AWSTemplateFormatVersion: '2010-09-09'
Description: 'Udemy Cloudformation template to create a VPC'
Resources:
  GeertVPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: 172.16.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: Banking
      
